[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-backtester-scripts"
version = "0.1.0"
description = "Python audit and reporting utilities for the LOB backtester"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
