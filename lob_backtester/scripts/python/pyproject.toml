[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-backtester-scripts"
version = "0.1.0"
description = "Python audit and reporting utilities for the LOB backtester"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15.0",
  "streamlit>=1.57",
  "plotly>=5.20",
  "kaleido>=0.2.1,<1",
  "matplotlib>=3.8",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
